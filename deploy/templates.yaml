apiVersion: v1
kind: Namespace
metadata:
  name: ${NAMESPACE}
  labels:
    pod-security.kubernetes.io/enforce: restricted
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aigw-claims-broker
  namespace: ${NAMESPACE}
  labels: {app: aigw-claims-broker}
spec:
  replicas: ${REPLICAS}
  selector:
    matchLabels: {app: aigw-claims-broker}
  template:
    metadata:
      labels: {app: aigw-claims-broker}
      annotations:
        aigw-claims-broker/config-hash: "${CONFIG_HASH}"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: broker
          image: ${IMAGE}
          command: ["node", "/app/src/server.js"]
          env:
            - {name: PORT, value: "8080"}
            - {name: BROKER_ISSUER, value: "${BROKER_ISSUER}"}
            - {name: BROKER_AUDIENCE, value: "${BROKER_AUDIENCE}"}
            - {name: BROKER_CONFIG_FILE, value: /config/broker-config.json}
            - {name: SIGNING_KEY_DIR, value: /keys}
            - {name: NODE_ENV, value: production}
          ports: [{containerPort: 8080, name: http}]
          resources:
            requests: {cpu: 10m, memory: 48Mi}
            limits: {cpu: 300m, memory: 160Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: app, mountPath: /app/src, readOnly: true}
            - {name: config, mountPath: /config, readOnly: true}
            - {name: keys, mountPath: /keys, readOnly: true}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 30
      volumes:
        - name: app
          configMap: {name: aigw-claims-broker-src}
        - name: config
          configMap: {name: aigw-claims-broker-config}
        - name: keys
          secret: {secretName: aigw-claims-broker-keys, defaultMode: 0440}
---
apiVersion: v1
kind: Service
metadata:
  name: aigw-claims-broker
  namespace: ${NAMESPACE}
  labels: {app: aigw-claims-broker}
${SERVICE_ANNOTATIONS}spec:
  type: ${SERVICE_TYPE}
  selector: {app: aigw-claims-broker}
  ports:
    - {name: http, port: 80, targetPort: 8080}
